name: Mac desktop CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# PRs can generate many rapid updates while the native Mac bundle compiles.
# Preserve only the newest run for a PR; never treat a canceled run as green.
concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Assert checked-out Git revision
        run: bash scripts/check-ci-checkout.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check all Rust source formatting (including build.rs)
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Assert checked-out Git revision
        run: bash scripts/check-ci-checkout.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build bundled WebView
        run: npm run build:webview
      - name: Foundation security/asset checks
        run: npm run test:foundation
      - name: Check macOS DMG verifier shell syntax
        run: bash -n scripts/verify-macos-bundle.sh scripts/dmg-inventory.sh
  rust-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Assert checked-out Git revision
        run: bash scripts/check-ci-checkout.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Prepare app icons and bundled WebView
        run: |
          npm ci --no-audit --no-fund
          npm run icons:desktop
          npm run build:webview
          npm run test:foundation
      - name: Run Rust unit tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
  macos:
    runs-on: macos-15
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Assert checked-out Git revision
        run: bash scripts/check-ci-checkout.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record native macOS queue wait (telemetry only)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/report-macos-queue.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate Tauri icons
        run: npm run icons:desktop
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Build frontend
        run: npm run build:webview
      - name: Foundation security/asset checks
        run: npm run test:foundation
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build unsigned macOS DMG
        run: npm run build
      - name: Verify the mounted DMG application, bundle identity and Apple Silicon binary
        run: bash scripts/verify-macos-bundle.sh
      - name: Upload unsigned DMG
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-security-agent-mac
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

